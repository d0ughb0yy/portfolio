<span class="prose-image-wrapper">
  <button class="prose-image-trigger" data-src="{{ .Destination }}" data-alt="{{ .Text }}" aria-label="Click to expand image">
    <img src="{{ .Destination }}" alt="{{ .Text }}" class="max-w-full max-h-[500px] h-auto mx-0 rounded-lg object-contain cursor-pointer hover:opacity-90 transition-opacity" loading="lazy" />
  </button>
</span>
